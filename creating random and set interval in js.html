<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Color Changer</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            transition: background-color 0.4s ease; 
        }

        
        header {
            width: 100%;
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        
        .color-box {
            width: 100%;
            max-width: 450px; 
            height: 250px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 4px solid #fff;
            transition: background-color 0.3s ease;
            margin-bottom: 30px;
            background-color: #ffffff; 
        }

        
        .btn-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
        }

        
        .btn {
            flex: 1;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
        }

        .btn-start:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        .btn-stop {
            background-color: #e74c3c;
            color: white;
        }

        .btn-stop:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        
        @media (max-width: 480px) {
            header h1 {
                font-size: 1.4rem;
            }
            .color-box {
                height: 200px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Using Random and SetInterval</h1>
    </header>

    <div class="container">
        <div id="colorDisplay" class="color-box"></div>

        <div class="btn-container">
            <button id="startBtn" class="btn btn-start">Start</button>
            <button id="stopBtn" class="btn btn-stop">Stop</button>
        </div>
    </div>

    <script>
        var t = null; 
        var r, g, b, c;
        
        var colorDisplay = document.getElementById("colorDisplay");
        var startBtn = document.getElementById("startBtn");
        var stopBtn = document.getElementById("stopBtn");

        function show() {
            r = Math.round(Math.random() * 255);
            g = Math.round(Math.random() * 255);
            b = Math.round(Math.random() * 255);
            c = `rgb(${r},${g},${b})`;
            
        
            colorDisplay.style.backgroundColor = c;
        }

        
        function startInterval() {
            if (t === null) { 
                t = setInterval(show, 400); 
            }
        }

        function stopInterval() {
            if (t !== null) {
                clearInterval(t);
                t = null; 
                alert("Set interval is stopped now");
            }
        }

        
        startBtn.onclick = startInterval;
        stopBtn.onclick = stopInterval;

        
    </script>
    
</body>
</html>
