<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>
        /* Poori screen ke margins ko zero kiya taaki header poori screen par faile */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
        }

        /* TOP FULL SCREEN CONTAINER FOR HEADER */
        .top-header-container {
            width: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 25px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .top-header-container header {
            color: white;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* IMAGES GALLERY GRID CONTAINER */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px; /* Images ke beech safe gap taaki hover par takraye nahi */
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* MODERN IMAGE STYLING */
        .pic {
            width: 100%;
            max-width: 300px; /* Desktop par size */
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
            cursor: pointer;
        }

        /* SMOOTH HOVER EFFECT (Bina aapas mein takraaye) */
        .pic:hover {
            transform: scale(1.08); /* Image halki si badi hogi par baaki images ko dhakka nahi degi */
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
            z-index: 5; /* Hover wali image sabke upar dikhegi */
        }

        /* MOBILE & TABLET RESPONSIVENESS */
        @media (max-width: 768px) {
            .top-header-container header {
                font-size: 24px;
            }
            .gallery-container {
                gap: 15px;
                padding: 20px 10px;
            }
            .pic {
                max-width: 45%; /* Tablets par ek line mein 2 images */
            }
        }

        @media (max-width: 480px) {
            .pic {
                max-width: 90%; /* Mobile par ek single badi image center mein */
            }
        }
    </style>
</head>
<body>

    <div class="top-header-container">
        <header>Image Gallery</header>
    </div>

    <div class="gallery-container" id="gallery"></div>

    <script>
        function preload() {
            var galleryContainer = document.getElementById("gallery");
            
            // Loop chala kar images generate karna
            for (var i = 1; i <= 10; i++) {
                var p = new Image();
                p.className = "pic";
                p.src = "https://picsum.photos/300/200?random=" + i;
                p.alt = "Gallery Image " + i;
                
                // Saari images ko container ke andar daal rahe hain
                galleryContainer.appendChild(p);
            }
        }
        window.onload = preload;
    </script>
</body>
</html>
