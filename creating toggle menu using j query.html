<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgb(12, 12, 12);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: inset 0 -2px 5px rgba(0, 0, 0, 0.3), 0 4px 6px rgba(0, 0, 0, 0.1);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            width: 100%;
        }

        .menu {
            
            margin: auto; 
            width: 90%;
            max-width: 600px; 
            background: #faf7f7;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .menu h3 {
            background: #fcfafa;
            color: rgb(12, 12, 12);
            padding: 20px; 
            font-size: 22px; 
            cursor: pointer;
            transition: background 0.3s;
        }

        .menu h3:hover {
            background: blue;
            color: #f5f5f7;
        }

        .menu ul {
            list-style: none;
            padding: 0;
            display: none; 
        }

        .menu ul li {
            border-bottom: 1px solid #ddd;
        }

        .menu ul li a {
            display: block;
            padding: 15px;
            color: #131212;
            padding-left: 20px;
            font-size: 18px; 
            text-decoration: none;
            transition: background 0.3s, color 0.3s, padding-left 0.3s;
        }

        .menu ul li a:hover {
            background: #1231df;
            color: #f5f5f7;
            padding-left: 30px;
        }

        
        
        
        @media (max-width: 768px) {
            .menu {
                max-width: 85%;
            }
        }

        
        @media (max-width: 600px) {
            header {
                font-size: 20px;
                padding: 15px;
            }
            .menu h3 {
                font-size: 20px;
                padding: 15px;
            }
            .menu ul li a {
                padding: 12px;
                padding-left: 15px;
                font-size: 16px; 
            }
        }

        
        @media (max-width: 480px) {
            .menu {
                width: 95%;
            }
        }
            
    </style>
</head>
<body>

    <header>Creating Toggle Menu Using jQuery</header>
    
    
    <div class="menu">
        <h3 id="home">Home</h3>
        <ul id="main-menu">
            <li><a href="https://mohitpathak2898-design.github.io/mysite/">Profile</a></li>
            <li><a href="https://mohitpathak2898-design.github.io/mysite/Daily%20Practice.html">Practice</a></li>
            <li><a href="https://mohitpathak2898-design.github.io/mysite/project.html">Projects</a></li>
        </ul>
        
        <h3 id="Projects">Projects</h3>
        <ul id="project-menu">
            <li><a href="https://mohitpathak2898-design.github.io/mysite/all%20practice%20work.html">HTML</a></li>
            <li><a href="https://mohitpathak2898-design.github.io/mysite/all%20js%20practice%20work.html">JavaScript</a></li>
            <li><a href="https://mohitpathak2898-design.github.io/mysite/all%20j%20query%20practice%20work.html">jQuery</a></li>
        </ul>

        <h3 id="social-media">Social Media</h3>
        <ul id="social-menu">
            <li><a href="https://www.facebook.com/">Facebook</a></li>
            <li><a href="https://www.instagram.com/">Instagram</a></li>
            <li><a href="https://www.behance.net/">Behance</a></li>
        </ul>
    </div>

    <script>
        $(document).ready(function() {
            
            $('#main-menu, #project-menu, #social-menu').hide();

            
            $('#home').click(function() {
                $('#main-menu').slideToggle();
                $('#project-menu, #social-menu').slideUp(); 
            });

            
            $('#Projects').click(function() {
                $('#project-menu').slideToggle();
                $('#main-menu, #social-menu').slideUp(); 
            });

            
            $('#social-media').click(function() {
                $('#social-menu').slideToggle();
                $('#main-menu, #project-menu').slideUp(); 
            });
        });
    </script>
</body>
</html>
