<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Frames</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center; 
            color: #333;
        }

       
        .main-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 5px;
            width: fit-content;
        }

        
        iframe {
            width: 100%;
            display: block;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); /* Sunder shadow effects */
            background-color: #fff;
            margin-bottom: 30px;
        }

        
        .portfolio-frame { height: 600px; }
        .table-frame { height: 450px; }
        .video-frame { 
            aspect-ratio: 16 / 9; 
            max-width: 800px; 
        }
        .map-frame { 
            height: 450px; 
            max-width: 800px; 
        }

        
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            h1 { font-size: 1.4rem; }
            .portfolio-frame { height: 450px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <h1>My Portfolio Website</h1>
        <iframe src="https://mohitpathak2898-design.github.io/mysite/" class="portfolio-frame"></iframe>

        <h1>Html Table</h1>
        <iframe src="Table.html" class="table-frame"></iframe>

        <h1>Using Youtube Video</h1>
        <iframe class="video-frame" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>

        <h1>Using Google Map</h1>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d13989.817830347947!2d77.1914658275874!3d28.765700867828503!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1776271211708!5m2!1sen!2sin" class="map-frame" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe> 

    </div>

</body>
</html>
