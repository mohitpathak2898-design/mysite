<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creating pop-ups with JavaScript</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        header {
            background-color: #181717;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        
        .mystyle {
            position: fixed;
            top: 45%; 
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border-radius: 12px; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3); 
            padding: 20px;
            z-index: 1000;
            width: 90%; 
            max-width: 500px; 
            text-align: center;
            animation: fadeIn 0.4s ease-out; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-weight: bold;
        }
        
        .close-btn:hover {
            color: red;
        }

        .pop-title {
            color: #333;
            font-size: 1.5rem;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .pop-gif {
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 350px; 
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Creating Pop-ups with JavaScript</h1>
    </header>

    <script>
       
        var p = document.createElement("div");

        function show() {
            document.body.appendChild(p);
            p.className = "mystyle";
            
           
            p.innerHTML = "<button class='close-btn' onclick='closeadd()'>×</button>";
            p.innerHTML += "<h2 class='pop-title'>This is a Pop-up!</h2>";
            p.innerHTML += "<img src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3gzd3Y1ZzNtc3B5bXN0Y3A3ZzRtc295NjZndW90YnZ0ZndpZnBtbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l3MMtvedZfGscS9uN8/giphy.gif' class='pop-gif' alt='Welcome GIF'/>";
            
           
            setTimeout("closeadd()", 10000);
        }

        function closeadd() {
            
            document.body.removeChild(p);
        }

        
        setTimeout("show()", 2000);
    </script>
    
</body>
</html>
