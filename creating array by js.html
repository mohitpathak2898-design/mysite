<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array in HTML</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            
            padding-bottom: 40px; 
        }

        
        .header-container {
            width: 100%; 
            text-align: center;
            background-color: #131313; 
            color: white;
            padding: 25px 20px;
            margin-bottom: 30px;
        }

        .header-container h1 {
            font-size: 28px;
        }

        
        .week-container {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;
            width: 100%;
            padding: 0 20px; 
        }

        
        .day-box {
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 6px;
            padding: 18px;
            width: 100%;      
            max-width: 400px;  
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .day-box h2 {
            font-size: 22px;
            color: #232424;
        }

        
        @media (max-width: 500px) {
            .header-container {
                padding: 20px 10px;
            }
            .header-container h1 {
                font-size: 24px;
            }
            .day-box h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Array in HTML</h1>
    </div>

    <div class="week-container">
        <script>
            
            var weeknames = new Array("Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday");
            
            
            for (var i = 0; i < weeknames.length; i++) {
                document.write("<div class='day-box'>");
                document.write("<h2>" + weeknames[i] + "</h2>");
                document.write("</div>");
            }
        </script>
    </div>

</body>
</html>
