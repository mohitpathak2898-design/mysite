
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <title>Flight menu</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        font-family: Arial, Helvetica, sans-serif;
        box-sizing: border-box;
    }
    #menu{
        margin-top: 10px;
        height: auto;
    }
    ol{
        margin-top: 10px;
        background: cyan;
        list-style: none;
        transition: 0.50s;
        position: relative;
        left: -1500px;
        //top: -15px;
    }
    ol li{
        padding: 10px;
        //margin-left: -40px;
    }
    ol li:hover{
        background: rgb(160, 235, 41);
    }
    #menu:hover ol{
        left: 0px;
        cursor: pointer;
    }


header{
    background:#0b1d3a;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    letter-spacing:2px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}


/* for mobile screen */
@media (max-width:600px){
    
footer{
        font-size:14px;
        padding:10px;
    }
    header{
        font-size:24px ;
        padding: 15px;
    }
}
</style>
<body>
<header>Flight-Menu</header>
    <main>
        <div id="menu">
            <span class="material-symbols-outlined">
                <i class="ri-menu-line"></i></span>
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="all practice work.html">Practice Work</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ol>
        </div>
    </main>
</body>
</html>
