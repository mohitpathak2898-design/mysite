<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Offcanvas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .hover-blue:hover {
            background-color: #0d6efd; 
            color: #ffffff; 
        }
    </style>
</head>

<body class="bg-light">

    <div class="bg-dark text-white text-center py-3 fixed-top shadow-sm w-100">
        <span class="fw-bold fs-5">Creating off canvas by bootstrap</span>
    </div>

    <div class="container d-flex flex-column justify-content-center align-items-center vh-100 pt-5">
        <div class="text-center pb-lg-5 mb-lg-5">
            <h2 class="mb-4">Bootstrap Offcanvas</h2>
            
            <button class="btn btn-primary btn-lg shadow-sm"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#myMenu">
                Open Menu
            </button>
        </div>
    </div>


    <div class="offcanvas offcanvas-start" tabindex="-1" id="myMenu">

        <div class="offcanvas-header bg-light border-bottom">
            <h5 class="offcanvas-title fw-bold">
                My Menu
            </h5>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Close">
            </button>
        </div>

        <div class="offcanvas-body">
            <p class="text-muted fw-semibold mb-4">Daily Practice work</p>
            <div class="list-group list-group-flush">
                <a href="all practice work.html" class="list-group-item list-group-item-action hover-blue">HTML</a>
                <a href="all js practice work.html" class="list-group-item list-group-item-action hover-blue">JavaScript</a>
                <a href="all j query practice work.html" class="list-group-item list-group-item-action hover-blue">jQuery</a>
                <a href="all bootstrap practice work.html" class="list-group-item list-group-item-action hover-blue">Bootstrap</a>
            </div>
        </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
