<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Do While Loop By Java Script</title>
    <style>
        * { margin: 0; 
            padding: 0;
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
           }

        body {
             display: flex; 
             flex-direction: column; 
             min-height: 100vh;
             }

        header { width: 100%; 
            background-color: #333; 
            color: white;
            padding: 20px; 
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .content { 
            flex: 1; 
            display: flex;
            justify-content: center; 
            align-items: center; 
           }
        
        
        #downloadLink {
            display: none; 
            text-decoration: none;
            color: #007bff;
            font-size: 2rem;
            padding: 15px 30px;
            border: 2px solid #007bff;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        #downloadLink:hover 
        { 
            background-color: #007bff; 
            color: white;
         }
    </style>
</head>
<body>

    <header>
        <h1>Creating do-while loop in JavaScript</h1>
    </header>

    <div class="content">
        <a href="Images/Conspiracy Theory.pdf" id="downloadLink">Download The File</a>
    </div>

    <script>
        var pw = "abc@123";
        var response;
        var turn = 0;
        var accessGranted = false;

        do {
            response = prompt("Enter The Password (Attempt " + (turn + 1) + "/3)");
            
            if(response == pw) {
                alert("✔ valid password");
                document.getElementById("downloadLink").style.display = "block"; 
                accessGranted = true;
                break;
            } else {
                turn++;
                if(turn >= 3) {
                    alert("❌ Access Denied... All attempts are over");
                }
            }
        } while(turn < 3);

        document.title = "Ready";
    </script>
</body>
</html>
