<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected File</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        
        header {
            width: 100%;
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 a {
            text-decoration: none;
            color: #007bff;
            font-size: 2rem;
            padding: 15px 30px;
            border: 2px solid #007bff;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        h1 a:hover {
            background-color: #007bff;
            color: white;
        }

        
        @media (max-width: 600px) {
            h1 a {
                font-size: 1.5rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Creating do-while loop in JavaScript</h1>
    </header>

    <div class="content">
        <h1><a href="Images/Conspiracy Theory.pdf">Download The File</a></h1>
    </div>

    <script>
        var pw ="abc@123"
        var response;
        var turn = 0

        var turn =0
        do {
            response = prompt("Enter The Password")
            
            if(response == pw)
        {
            alert("✔ valid password")
            break;
        }

            if(turn>=3)
        {
            alert("❌ Acess Denied...  # turn are over")
        }

            turn++
        } 

        while(turn<=3)

        document.title= "Ready"
    </script>
</body>
</html>
