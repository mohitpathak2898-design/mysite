<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio_Video</title>
</head>
<style>
body{
    padding: 0;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #e7e7e7;
}

.media-container{
    text-align: center;
    line-height: 0; 
}

audio, video{
    display: block;
    margin: 0 auto; 
}

audio {
    margin-bottom: 20px; 
}

video{
    max-width:100%;
    height:auto;
    display: block; 
}

header{
    background:#004d4d;
    color:white;
    text-align:center;
    padding:20px;
    font-size:30px;
    letter-spacing:2px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}

@media (max-width: 600px){
    header{
        font-size:20px;
        padding:15px;
    }
}
</style>
<body>
<header>Using Web Video</header>
    <video controls autoplay loop muted>
        <source src="Images/p36.mp4" type="video/mp4">
        <h1>Update your browser/This video is not supported in your web browser</h1>
    </video>
  
</body>
</html>
