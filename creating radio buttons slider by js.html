<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creating Radio Button Slide In Java Script</title>

<style>
    
    * { margin:0; 
        padding:0; 
        box-sizing:border-box; 
        font-family:Arial, sans-serif; }
    
        body 
      { 
        background:#f5f7fb; 
       }

    header {
        background:#050505; 
        color:white; 
        text-align:center;
        padding:20px; 
        font-size:30px; 
        font-weight:bold;
        letter-spacing:2px; 
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        margin-bottom:30px;
    }

    
    .banner {
        width: 90%;
        max-width: 700px; 
        aspect-ratio: 16 / 9; 
        margin: auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.3);
    }

    .banner img 
    { 
     width:100%; 
     height:100%; 
     object-fit:cover; 
    }

    .radios 
    { 
      text-align:center; 
      margin-top:20px; 
    }
    
    .radios input[type="radio"] 
    {
        width:20px;
        height:20px; 
        margin:0 10px; 
        cursor:pointer;
    }

    @media(max-width:600px) {
        header 
        { font-size:20px; 
        padding:15px; 
        }
        .radios input [type="radio"] 
        {
         width:16px; 
        height:16px; 
        margin:0 6px; 
        }
    }
</style>
</head>

<body onload="show()">

<header>Creating Radio Banner Slider In Java Script</header>

<div class="banner">
    <img src="Images/p59.jpg" id="p">
</div>

<div class="radios">
    <input type="radio" name="slide">
    <input type="radio" name="slide">
    <input type="radio" name="slide">
    <input type="radio" name="slide">
</div>

<script>
    var p = document.getElementById("p");
    var s = document.getElementsByName("slide");

    var c = 1;
    var t;

    function show()
    {
        
        if(c == 1) { p.src = "Images/p59.jpg"; }
        else if(c == 2) { p.src = "Images/p60.jpg"; }
        else if(c == 3) { p.src = "Images/p57.jpg"; }
        else if(c == 4) { p.src = "Images/p58.jpg"; }

        s[c-1].checked = true;

        c++;
        if(c > 4) { c = 1; }

        t = setTimeout(show, 3000);
    }

    
    s[0].addEventListener("click", function()
    {
        clearTimeout(t);
        c = 1;
        p.src = "Images/p59.jpg";
        t = setTimeout(show, 3000);
    });

    s[1].addEventListener("click", function()
    {
        clearTimeout(t);
        c = 2;
        p.src = "Images/p60.jpg";
        t = setTimeout(show, 3000);
    });

    s[2].addEventListener("click", function()
    {
        clearTimeout(t);
        c = 3;
        p.src = "Images/p57.jpg";
        t = setTimeout(show, 3000);
    });

    s[3].addEventListener("click", function()
    {
        clearTimeout(t);
        c = 4;
        p.src = "Images/p58.jpg";
        t = setTimeout(show, 3000);
    });
</script>
</body>
</html>
