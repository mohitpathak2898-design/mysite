<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Activity</title>
    <style>
        *{ margin:0; 
          padding:0; 
          box-sizing:border-box; 
          font-family: Arial, Helvetica, sans-serif; 
         }
        html{ 
            scroll-behavior: smooth; 
        }
        body{ 
            background-color:#f5f7fb; 
            color:#333; 
        }
        header{ 
            background:#000000; 
            color:white; 
            margin-bottom: 30px; 
            text-align:center; 
            padding:20px; 
            font-size:30px; 
            letter-spacing:2px; 
            font-weight:bold; 
            box-shadow:0 4px 10px rgba(0,0,0,0.2); 
        }
        #mycan{ 
            display:block; 
            width:90%; 
            max-width:900px; 
            height:500px; 
            margin:30px auto; 
            background:#ffffff; 
            border:4px solid #0b1d3a; 
            border-radius:18px; 
            box-shadow:0 8px 20px rgba(0,0,0,0.2); 
            cursor: crosshair; 
        }
        .controls{
            width:90%; 
            max-width:900px; 
            margin:25px auto; 
            background:white; 
            border-radius:15px; 
            padding:20px; 
            box-shadow:0px 5px 15px rgba(0,0,0,.2); 
        }
        .controls 
        h2{ 
            text-align:center; 
            color:#0b1d3a; 
            margin-bottom:15px; 
        }
        .controls 
        table{ 
            width:100%; 
            border-collapse:collapse; 
        }
        .controls 
        th{ 
            background:blue; 
            color:white; 
            padding:12px; 
        }
        .controls 
        td{ 
            border:1px solid #ddd; 
            padding:12px; 
            text-align:center; 
        }
        @media (max-width: 600px){
            header{ 
                font-size:20px; 
                padding:15px; 
            }
            #mycan{
                width:95%; 
                height:400px; 
            }
            .controls{
    width:95%;
    padding:15px;
}

.controls h2{
    font-size:20px;
}

.controls th,
.controls td{
    font-size:14px;
    padding:8px;
}
        }
    </style>
</head>
<body>
    <header>Creating Keyboard Activity By Java Script</header>

    <canvas id="mycan" width="900" height="500"></canvas>

    <div class="controls">
        <h2>Keyboard Controls</h2>
        <table>
            <tr>
                <th>Key</th>
                <th>Action</th>
            </tr>
            <tr>
                <td>I</td>
                <td>Increase Circle Size</td>
            </tr>
            <tr>
                <td>D</td>
                <td>Decrease Circle Size</td>
            </tr>
            <tr>
                <td>C</td>
                <td>Clear Canvas</td>
            </tr>
            <tr>
                <td>Mouse Click</td>
               <td>Start / Stop Drawing</td>
            </tr>
            <tr>
                <td>Mouse Move</td>
                <td>Draw Random Color Circles</td>
            </tr>
        </table>
    </div>

    <script>
        var c = document.getElementById("mycan");
        var d = c.getContext("2d");
        var r = 10;
        var isDrawing = true;

        function f1(event) {
            var k = event.key.toLowerCase();
            switch(k) {
                case "i":
                    if(r < 100) r += 5;
                    document.title = "Size: " + r;
                    break;
                case "d":
                    if(r > 5) r -= 5;
                    document.title = "Size: " + r;
                    break;
                case "c":
                    d.clearRect(0, 0, c.width, c.height);
                    break;
            }
        }

        function draw(event) {
            var rect = c.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            
            var red = Math.round(Math.random() * 255);
            var green = Math.round(Math.random() * 255);
            var blue = Math.round(Math.random() * 255);

            d.beginPath();
            d.arc(x, y, r, 0, 2 * Math.PI);
            d.fillStyle = "rgb(" + red + "," + green + "," + blue + ")";
            d.fill();
            d.stroke();
        }

        document.addEventListener("keydown", f1);
        c.addEventListener("mousemove", draw);
    </script>
</body>
</html>
